[project]
name = "skein"
version = "0.1.0"
description = "A minimal, composable library for building multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yijie Huang" }
]
keywords = ["llm", "agent", "multi-agent", "mcp", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.16.2,<0.17",
    "mypy>=1.0",
]
langsmith = [
    "langsmith>=0.1.0",
]
mcp = [
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skein"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pin the rule set explicitly: ruff's implicit defaults change between releases,
# so relying on them makes lint results depend on whichever version CI resolves.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "DTZ",  # timezone-aware datetimes (trace timestamps must be comparable)
    "RUF",  # ruff-specific
]
ignore = [
    # Comments are written in Chinese in places; full-width punctuation is
    # intended there, not a homoglyph slip.
    "RUF001",
    "RUF002",
    "RUF003",
]